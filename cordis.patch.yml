# dsh-session-purge 的加载补丁：把宿主半边插进 composition。
#
# 只做两段文件移动：归档会话 → 独立回收站（trash/），回收站条目满期 → 物理删除。
# 从不直接删会话；不碰 DSH 的 workspace.json、attachments、sessions-archive、fast-search.db。
#
# 这里只给安全缺省：dryRun: true —— 只写日志与 state.json，不动任何文件。
# 所有路径都省略，由 $DSH_HOME（缺省 ~/.dsh）推导：
#   sessionsRoot         $DSH_HOME/sessions
#   projectionCacheDir   $DSH_HOME/storages/session_projcache/sessions
#   trashRoot            $DSH_HOME/session-purge/trash
#   statePath            $DSH_HOME/session-purge/state.json
#   logFile              $DSH_HOME/logs/session-purge.log
#
# 要改行为或路径，别改这个文件（升级会被覆盖）：在 profile 的 cordis.patch.yml 里
# 按 id 覆盖，config 是整体替换、不深合并，所以字段要写全：
#
#   - id: session-purge
#     config:
#       enabled: true
#       dryRun: false
#       archiveRetentionDays: 30
#       trashRetentionDays: 7
#       intervalMinutes: 1440
#       startupDelayMs: 60000
#       maxMovesPerRun: 50
#       maxTrashPurgesPerRun: 100
#       moveProjectionCache: true
#       trashRoot: D:\dsh-trash
#       ...
- insert:
    - id: session-purge
      name: dsh-session-purge
      config:
        dryRun: true
